<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Watchman - Live Critical Errors</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 12px; }
        h1 { color: #38bdf8; margin: 0; font-size: 1.6rem; }

        /* Toggle Switch Styling */
        .toggle-container { display: flex; align-items: center; gap: 10px; background-color: #1e293b; padding: 6px 14px; border-radius: 20px; border: 1px solid #334155; }
        .toggle-label { font-size: 0.85rem; font-weight: bold; color: #94a3b8; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #38bdf8; }
        input:checked + .slider:before { transform: translateX(22px); }

        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background-color: #1e293b; border-radius: 8px; padding: 15px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        .card h2 { margin-top: 0; color: #94a3b8; font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .log-box { height: 500px; overflow-y: auto; font-family: monospace; font-size: 0.88rem; background-color: #090d16; padding: 12px; border-radius: 6px; }

        /* Key-Value Pair Cards */
        .kv-card { margin-bottom: 10px; padding: 10px; border-radius: 6px; background-color: #1a2332; border-left: 4px solid #38bdf8; }
        .kv-card.ERROR { border-left-color: #ef4444; }
        .kv-row { display: flex; margin-bottom: 4px; }
        .kv-key { font-weight: bold; color: #64748b; width: 110px; flex-shrink: 0; }
        .kv-val { color: #f8fafc; word-break: break-all; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-ERROR { background-color: #ef4444; color: white; }
        .badge-INFO { background-color: #3b82f6; color: white; }

        /* Dev Mode Raw JSON View */
        .json-block { margin-bottom: 10px; padding: 10px; border-radius: 6px; background-color: #0d1117; border: 1px solid #30363d; color: #e6edf3; white-space: pre-wrap; word-break: break-all; font-size: 0.82rem; }

        /* AI RCA Output */
        .ai-card { background-color: #1e1b4b; border-left: 4px solid #818cf8; margin-bottom: 12px; padding: 12px; border-radius: 6px; white-space: pre-wrap; font-family: sans-serif; line-height: 1.4; }
    </style>
</head>
<body>
<div class="header">
    <div>
        <h1>Log Watchman Operational Center</h1>
        <small style="color: #64748b;">Live SSE Event Stream & AI Analysis</small>
    </div>
    <div style="display: flex; align-items: center; gap: 15px;">
        <span id="status" style="color: #22c55e; font-size: 0.85rem; font-weight: bold;">Connecting...</span>
        <div class="toggle-container">
            <span class="toggle-label">DEV MODE</span>
            <label class="switch">
                <input type="checkbox" id="devModeToggle" onchange="toggleViewMode()">
                <span class="slider"></span>
            </label>
        </div>
    </div>
</div>

<div class="container">
    <div class="card">
        <h2>Ingested Logs</h2>
        <div id="logStream" class="log-box"></div>
    </div>

    <div class="card">
        <h2>Automated AI Root Cause Analyses</h2>
        <div id="aiStream" class="log-box"></div>
    </div>
</div>

<script>
    const eventSource = new EventSource('/logWatchman/stream');
    const statusEl = document.getElementById('status');
    const logStream = document.getElementById('logStream');
    const aiStream = document.getElementById('aiStream');
    const toggle = document.getElementById('devModeToggle');

    const logsBuffer = [];

    eventSource.onopen = () => {
        statusEl.innerText = "● LIVE STREAM CONNECTED";
        statusEl.style.color = "#22c55e";
    };

    eventSource.onerror = () => {
        statusEl.innerText = "● DISCONNECTED";
        statusEl.style.color = "#ef4444";
    };

    eventSource.addEventListener('LOG_EVENT', (e) => {
        const rawData = JSON.parse(e.data);
        logsBuffer.unshift(rawData);
        renderLogItem(rawData, toggle.checked);
    });

    eventSource.addEventListener('AI_ANALYSIS', (e) => {
        const entry = document.createElement('div');
        entry.className = 'ai-card';
        entry.innerText = e.data;
        aiStream.prepend(entry);
    });

    function renderLogItem(data, isDevMode) {
        const entry = document.createElement('div');

        if (isDevMode) {
            entry.className = 'json-block';
            entry.innerText = JSON.stringify(data, null, 2);
        } else {
            entry.className = `kv-card ${data.logLevel || ''}`;
            entry.innerHTML = `
                <div class="kv-row">
                    <span class="kv-key">Service:</span>
                    <span class="kv-val"><strong>${data.serviceName || 'N/A'}</strong></span>
                </div>
                <div class="kv-row">
                    <span class="kv-key">Log Level:</span>
                    <span class="kv-val"><span class="badge badge-${data.logLevel}">${data.logLevel || 'N/A'}</span></span>
                </div>
                <div class="kv-row">
                    <span class="kv-key">Message:</span>
                    <span class="kv-val">${data.message || 'N/A'}</span>
                </div>
                ${data.stackTrace ? `
                <div class="kv-row">
                    <span class="kv-key">Stack Trace:</span>
                    <span class="kv-val" style="color: #f87171;">${data.stackTrace}</span>
                </div>` : ''}
                <div class="kv-row">
                    <span class="kv-key">Trace ID:</span>
                    <span class="kv-val" style="color: #64748b;">${data.traceId || 'N/A'}</span>
                </div>
            `;
        }

        logStream.prepend(entry);
    }

    function toggleViewMode() {
        logStream.innerHTML = '';
        const isDev = toggle.checked;
        for (let i = logsBuffer.length - 1; i >= 0; i--) {
            renderLogItem(logsBuffer[i], isDev);
        }
    }
</script>
</body>
</html>
