spring.application.name=logMonitor
server.port=5000

logging.level.root=INFO
logging.level.dev.logMonitor=INFO

spring.ai.ollama.chat.options.model=phi3:mini
spring.ai.ollama.embedding.options.model=nomic-embed-text

spring.ai.ollama.base-url=http://localhost:11434

# PGVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768


# Spring Kafka Properties
spring.kafka.bootstrap-servers=kafka-broker:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=dev.logMonitor.dto


# Kafka Consumer Configuration
spring.kafka.consumer.group-id=log-monitor-group
spring.kafka.consumer.auto-offset-reset=earliest

# App-specific topic name setting
app.kafka.topic=log-ingestion-topic